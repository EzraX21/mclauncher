name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 测试（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 装依赖
        run: python -m pip install -U pip && python -m pip install "textual>=8,<9" "questionary>=2.0,<3"
      - name: 跑测试
        run: python -m unittest discover -s tests -v

  gui:
    name: 前端（类型检查 + 冒烟测试 + 截图）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装前端依赖
        working-directory: gui
        run: |
          npm install --include=dev
          npx playwright install --with-deps chromium
      - name: 类型检查
        working-directory: gui
        run: npx tsc --noEmit
      - name: 冒烟测试（jsdom）
        working-directory: gui
        run: npm test
      - name: 截图（验证界面能真渲染出来，不是只有结构）
        working-directory: gui
        env:
          MCL_PYTHON: python3
        run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/gui-*.png
          if-no-files-found: warn