name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux 包（deb / rpm / Arch / 源码包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: 安装 nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz nfpm
          sudo mv nfpm /usr/local/bin/nfpm
      - name: 构建
        run: ./packaging/build_linux.sh
        env:
          NFPM: nfpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 exe + 安装包
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    name: macOS app / dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 .app + dmg
        run: bash packaging/macos/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    name: 发布 Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  aur:
    name: 提交 AUR
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true   # 没配 AUR secrets 时不要让整个 release 变红
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新 PKGBUILD 版本
        run: python3 packaging/aur/update_version.py "${GITHUB_REF_NAME}"
      - uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: mclauncher
          pkgbuild: ./packaging/aur/PKGBUILD
          assets: ./packaging/aur/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: mclauncher ${{ github.ref_name }}
          force_push: "true"
