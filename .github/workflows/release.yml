name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux 包（deb / rpm / Arch / 源码包）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建 GUI
        working-directory: gui
        run: |
          npm install --include=dev
          npm run build
      - name: 安装 nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz nfpm
          sudo mv nfpm /usr/local/bin/nfpm
      - name: 构建
        run: ./packaging/build_linux.sh
        env:
          NFPM: nfpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建 GUI
        shell: pwsh
        working-directory: gui
        run: |
          npm install --include=dev
          npm run build
      - name: 构建 exe + 安装包
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-portable.zip

  release:
    name: 发布 Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: 生成 SHA256SUMS
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}

  r2:
    name: 同步到 Cloudflare R2
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta.') && !contains(github.ref_name, '-rc.')
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 检查 R2 配置
        id: check
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "R2 secrets 未配置，跳过同步"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 下载 Release 产物
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: 安装 AWS CLI
        if: steps.check.outputs.configured == 'true'
        run: pip install --quiet awscli
      - name: 生成 latest.json
        if: steps.check.outputs.configured == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          files = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({"name": path.name, "size": path.stat().st_size, "sha256": digest})
          manifest = {"tag": os.environ["TAG"], "assets": files}
          pathlib.Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"latest.json: {len(files)} files")
          PY
      - name: 上传到 R2
        if: steps.check.outputs.configured == 'true'
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist "s3://${R2_BUCKET}/releases/${TAG}/" --recursive             --endpoint-url "$ENDPOINT" --cache-control "public, max-age=31536000, immutable"
          for file in dist/*; do
            [ -f "$file" ] || continue
            aws s3 cp "$file" "s3://${R2_BUCKET}/latest/$(basename "$file")"               --endpoint-url "$ENDPOINT" --cache-control "public, max-age=300"
          done
          aws s3 cp latest.json "s3://${R2_BUCKET}/latest.json"             --endpoint-url "$ENDPOINT" --content-type "application/json"             --cache-control "public, max-age=300"

  aur:
    name: 提交 AUR
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta.') && !contains(github.ref_name, '-rc.')
    continue-on-error: true   # 没配 AUR secrets 时不要让整个 release 变红
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新 PKGBUILD 版本
        run: python3 packaging/aur/update_version.py "${GITHUB_REF_NAME}" --checksum
      - uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: mcl-launcher
          pkgbuild: ./packaging/aur/PKGBUILD
          assets: ./packaging/aur/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: mcl ${{ github.ref_name }}
          force_push: "true"
