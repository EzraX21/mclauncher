[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-launcher"
version = "3.7.0"
description = "MCL (mclauncher), a Minecraft launcher with a native GUI and a TUI mode"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mclauncher" }]
license = { file = "LICENSE" }
keywords = ["minecraft", "launcher", "tui", "modrinth", "fabric", "quilt"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = ["textual>=8,<9"]

[project.optional-dependencies]
cli = ["questionary>=2.0,<3"]
gui = ["pywebview>=6"]
dev = ["questionary>=2.0,<3", "build", "installer"]

[project.scripts]
mcl = "mcl.cli:main"
mcl-tui = "mcl.tui.app:run"

[project.urls]
Homepage = "https://github.com/ezrax21/mclauncher"

[tool.setuptools]
packages = ["mcl", "mcl.tui", "mcl.tui.panes"]

[tool.setuptools.package-data]
mcl = ["tui/*.tcss", "webui_dist/*", "assets/*.png"]
